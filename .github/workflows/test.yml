# Workflow check, typecheck and unit tests on pushes to main and on every pull request.
# Needs no secrets.
name: test
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Workflow check (CLAUDE.md, decisions record, plans, skills)
        run: python3 .claude/workflow/check.py
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
